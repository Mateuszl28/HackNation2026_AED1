name: Nocna aktualizacja danych AED
on:
  schedule:
    - cron: '0 3 * * *'   # codziennie 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Wykrycie zbiorów w dane.gov.pl, pobranie i integracja
        run: npm run data:fetch
      - name: Commit zaktualizowanych danych
        run: |
          git config user.name "aedostepni-bot"
          git config user.email "aedostepni-bot@users.noreply.github.com"
          git add data pipeline/raw pipeline/sources.auto.json web/public/data
          if git diff --cached --quiet; then echo "Brak zmian w danych"; exit 0; fi
          git commit -m "Dane: automatyczna aktualizacja $(date -u +%F)"
          git push
